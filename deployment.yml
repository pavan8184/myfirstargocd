apiVersion: apps/v1
kind: Deployment
metadata:
  name: prudhvi
spec:
  replicas: 4
  selector:
    matchLabels:
      app: zomato
  template:
    metadata:
      labels:
        app: zomato
    spec:
      containers:
        - name: cont-1
          image: shaikmustafa/cycle:latest
          ports:
            - containerPort: 80
